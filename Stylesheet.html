<style>
  /* Custom Animations & Styles */
  @keyframes scanline {
    0% {
      top: 0%;
      opacity: 0.8;
    }
    50% {
      opacity: 1;
    }
    100% {
      top: 100%;
      opacity: 0.8;
    }
  }

  .scan-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, rgba(59, 130, 246, 0) 0%, rgba(59, 130, 246, 1) 50%, rgba(59, 130, 246, 0) 100%);
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
    animation: scanline 2.5s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes pulseGlow {
    0%, 100% {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    50% {
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
    }
  }

  .glow-active {
    animation: pulseGlow 2s infinite;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #0f172a;
  }
  ::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #475569;
  }

  /* Video Mirroring for natural front-camera experience */
  .mirror-mode {
    transform: scaleX(-1);
  }

  /* Glassmorphism Cards */
  .glass-card {
    background: rgba(30, 41, 59, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Toast Notification */
  .toast-enter {
    transform: translateY(-20px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast-visible {
    transform: translateY(0);
    opacity: 1;
  }
</style>
