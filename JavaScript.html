<script>
  /**
   * ==============================================================================
   * Client-side Controller: Face Recognition, Camera, TTS & State Management
   * ==============================================================================
   */

  // --- Configuration & Endpoints ---
  const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
  const MODEL_URL_BACKUP = 'https://cdn.jsdelivr.net/gh/cshlydm/face-api.js@master/weights';

  // --- Application State ---
  const state = {
    modelsLoaded: false,
    cameraStarted: false,
    currentTab: 'scanner',
    profiles: [],             // Registered face profiles
    faceMatcher: null,        // faceapi.FaceMatcher instance
    stream: null,             // MediaStream
    isDetecting: false,
    soundEnabled: true,
    thaiVoice: null,
    
    // State machine for greeting: { [name]: { lastSeen: number, hasGreeted: boolean } }
    trackedPersons: new Map(),
    unknownTracker: { lastSeen: 0, hasGreeted: false },
    EXIT_THRESHOLD_MS: 3000,   // เดินออกจากรัศมีกล้องเกิน 3 วินาที จะถือว่าออกจากกล้องและรีเซ็ตสถานะทักทาย
    
    // Registration temp
    capturedDescriptor: null,
    capturedImageBase64: null
  };

  // --- Helper: รอให้ไลบรารี faceapi โหลดเสร็จ ---
  function waitForFaceApi(timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const startTime = Date.now();
      const check = () => {
        if (typeof faceapi !== 'undefined') {
          resolve();
        } else if (Date.now() - startTime > timeoutMs) {
          reject(new Error('โหลดโมเดล face-api.js ไม่สำเร็จ (Timeout)'));
        } else {
          setTimeout(check, 100);
        }
      };
      check();
    });
  }

  // --- Initializer on Page Load ---
  async function initializeApp() {
    console.log('[FaceApp] กำลังเริ่มต้นระบบ...');
    try {
      initSpeechSynthesis();
    } catch (e) {
      console.warn('Speech init warning:', e);
    }

    try {
      setupEventListeners();
    } catch (e) {
      console.warn('Event listener setup warning:', e);
    }

    // เริ่มโหลดโมเดล AI
    loadFaceApiModels();

    // ดึงข้อมูลโปรไฟล์จาก Google Sheets
    loadProfilesFromBackend();
  }

  // รองรับทั้งกรณีที่ DOM กำลังโหลด หรือโหลดเสร็จไปแล้ว (เช่น ใน Google Apps Script iframe)
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeApp);
  } else {
    initializeApp();
  }

  // --- Voice & Speech Synthesis ---
  function initSpeechSynthesis() {
    const voiceStatusEl = document.getElementById('voiceStatusBadge');
    if ('speechSynthesis' in window) {
      const updateVoices = () => {
        try {
          const voices = window.speechSynthesis.getVoices();
          // ค้นหาเสียงภาษาไทย (th-TH / th)
          state.thaiVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('th')) || null;
          if (voiceStatusEl) {
            if (state.thaiVoice) {
              voiceStatusEl.innerHTML = `🟢 เสียงไทย: ${state.thaiVoice.name}`;
              voiceStatusEl.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-500/40';
            } else if (voices.length > 0) {
              voiceStatusEl.innerHTML = `🟢 เสียงระบบเบราว์เซอร์`;
              voiceStatusEl.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-500/40';
            } else {
              voiceStatusEl.innerHTML = `🟢 ระบบเสียงพร้อม`;
              voiceStatusEl.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-500/40';
            }
          }
        } catch (e) {
          console.warn('Voice update error:', e);
        }
      };

      window.speechSynthesis.onvoiceschanged = updateVoices;
      updateVoices();
      setTimeout(updateVoices, 500);
      setTimeout(updateVoices, 1500);
    } else {
      if (voiceStatusEl) {
        voiceStatusEl.innerHTML = `🟡 ใช้เสียง Web Audio`;
        voiceStatusEl.className = 'text-xs px-2.5 py-1 rounded-full bg-amber-900/60 text-amber-300 border border-amber-500/40';
      }
    }
  }

  /**
   * เปล่งเสียงพูดภาษาไทย
   */
  function speakText(text) {
    if (!state.soundEnabled || !text) return;

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // ตัดประโยคเก่าที่อาจค้างอยู่
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'th-TH';
      utterance.rate = 0.95;  // ความเร็วปานกลาง ชัดเจน
      utterance.pitch = 1.05; // เสียงสดใส เป็นมิตร
      if (state.thaiVoice) {
        utterance.voice = state.thaiVoice;
      }
      window.speechSynthesis.speak(utterance);
    } else {
      // Fallback: ใช้ Web Audio / Google Translate Audio
      try {
        const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q=${encodeURIComponent(text)}`);
        audio.play().catch(e => console.warn('Audio play blocked:', e));
      } catch (e) {
        console.warn('TTS fallback error:', e);
      }
    }

    // แสดงแบนเนอร์ข้อความทักทายบนหน้าจอ
    showGreetingBanner(text);
  }

  function showGreetingBanner(text) {
    const banner = document.getElementById('greetingBanner');
    const bannerText = document.getElementById('greetingBannerText');
    if (banner && bannerText) {
      bannerText.textContent = text;
      banner.classList.remove('hidden');
      banner.classList.add('flex');

      clearTimeout(banner._timer);
      banner._timer = setTimeout(() => {
        banner.classList.add('hidden');
        banner.classList.remove('flex');
      }, 5000);
    }
  }

  // --- Load Face-API Models ---
  async function loadFaceApiModels() {
    const modelBadge = document.getElementById('modelStatusBadge');
    if (modelBadge) {
      modelBadge.innerHTML = '⏳ กำลังโหลดโมเดล AI...';
      modelBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-blue-900/60 text-blue-300 border border-blue-500/40';
    }

    try {
      await waitForFaceApi(15000);
      let url = MODEL_URL;
      // พยายามโหลดโมเดลหลัก
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(url),
        faceapi.nets.faceLandmark68Net.loadFromUri(url),
        faceapi.nets.faceRecognitionNet.loadFromUri(url),
        faceapi.nets.ssdMobilenetv1.loadFromUri(url)
      ]);

      state.modelsLoaded = true;
      if (modelBadge) {
        modelBadge.innerHTML = '🟢 โมเดล AI พร้อมใช้งาน';
        modelBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-500/40';
      }
      showToast('โหลดโมเดลจดจำใบหน้าสำเร็จ', 'success');
    } catch (err) {
      console.warn('โหลดโมเดลหลักไม่สำเร็จ ลองเชื่อมต่อไปยัง CDN สำรอง...', err);
      try {
        let backupUrl = MODEL_URL_BACKUP;
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(backupUrl),
          faceapi.nets.faceLandmark68Net.loadFromUri(backupUrl),
          faceapi.nets.faceRecognitionNet.loadFromUri(backupUrl),
          faceapi.nets.ssdMobilenetv1.loadFromUri(backupUrl)
        ]);
        state.modelsLoaded = true;
        modelBadge.innerHTML = '🟢 โมเดล AI พร้อมใช้งาน';
        modelBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-500/40';
        showToast('โหลดโมเดลจดจำใบหน้าสำเร็จ (CDN สำรอง)', 'success');
      } catch (errBackup) {
        console.error('Model load failure:', errBackup);
        modelBadge.innerHTML = '🔴 โหลดโมเดล AI ล้มเหลว';
        modelBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-red-900/60 text-red-300 border border-red-500/40';
        showToast('ไม่สามารถโหลดโมเดล AI กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต', 'error');
      }
    }
  }

  // --- Backend Sync: Profiles & Descriptors ---
  function loadProfilesFromBackend() {
    const listEl = document.getElementById('profilesListContainer');
    if (listEl) {
      listEl.innerHTML = '<div class="text-center py-6 text-slate-400"><div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-blue-500 border-t-transparent mb-2"></div><p>กำลังโหลดข้อมูลโปรไฟล์...</p></div>';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(response => {
          if (response && response.success) {
            state.profiles = response.profiles || [];
            updateFaceMatcher();
            renderProfilesList();
            document.getElementById('profileCountBadge').textContent = `${state.profiles.length} คน`;
          } else {
            showToast(response.message || 'ดึงข้อมูลใบหน้าล้มเหลว', 'error');
          }
        })
        .withFailureHandler(err => {
          console.error(err);
          showToast('เชื่อมต่อ Google Sheets ไม่สำเร็จ: ' + err.message, 'error');
        })
        .getFaceProfiles();
    } else {
      // Mock Data สำหรับการทดสอบในเครื่อง Local Preview
      console.warn('google.script.run is not available (Local Dev Mode)');
      state.profiles = [];
      updateFaceMatcher();
      renderProfilesList();
    }
  }

  /**
   * อัปเดต FaceMatcher เมื่อมีการเพิ่ม/ลบโปรไฟล์ใบหน้า
   */
  function updateFaceMatcher() {
    if (!state.profiles || state.profiles.length === 0) {
      state.faceMatcher = null;
      return;
    }

    const labeledDescriptors = [];
    state.profiles.forEach(p => {
      if (p.descriptors && p.descriptors.length > 0) {
        const floatArray = new Float32Array(p.descriptors);
        labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(p.name, [floatArray]));
      }
    });

    if (labeledDescriptors.length > 0) {
      // Euclidean Distance Threshold: 0.55 (ค่าน้อย = ตรวจเข้มงวด แม่นยำขึ้น)
      state.faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);
    } else {
      state.faceMatcher = null;
    }
  }

  // --- Camera Management ---
  async function startCamera() {
    if (state.cameraStarted) return;
    const video = document.getElementById('webcamVideo');
    const startBtn = document.getElementById('startCameraBtn');
    const cameraBadge = document.getElementById('cameraStatusBadge');

    try {
      const constraints = {
        video: {
          width: { ideal: 640 },
          height: { ideal: 480 },
          facingMode: 'user'
        },
        audio: false
      };

      state.stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = state.stream;
      await video.play();

      state.cameraStarted = true;
      cameraBadge.innerHTML = '🟢 กล้องทำงานอยู่';
      cameraBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-500/40';
      startBtn.classList.add('hidden');
      document.getElementById('stopCameraBtn').classList.remove('hidden');

      // เริ่มวงรอบตรวจจับใบหน้า
      startRecognitionLoop();
    } catch (err) {
      console.error('Camera access error:', err);
      showToast('ไม่สามารถเปิดกล้องได้: ' + err.message, 'error');
      cameraBadge.innerHTML = '🔴 กล้องไม่พร้อมใช้งาน';
      cameraBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-red-900/60 text-red-300 border border-red-500/40';
    }
  }

  function stopCamera() {
    if (state.stream) {
      state.stream.getTracks().forEach(track => track.stop());
      state.stream = null;
    }
    state.cameraStarted = false;
    state.isDetecting = false;

    const video = document.getElementById('webcamVideo');
    video.srcObject = null;

    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    document.getElementById('startCameraBtn').classList.remove('hidden');
    document.getElementById('stopCameraBtn').classList.add('hidden');

    const cameraBadge = document.getElementById('cameraStatusBadge');
    cameraBadge.innerHTML = '⚪ กล้องปิดอยู่';
    cameraBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700';
  }

  // --- Real-time Face Recognition Loop & Greet State Machine ---
  async function startRecognitionLoop() {
    if (state.isDetecting) return;
    state.isDetecting = true;

    const video = document.getElementById('webcamVideo');
    const canvas = document.getElementById('overlayCanvas');

    // ตรวจสอบขนาด canvas ให้ตรงกับขนาดที่แท้จริงของ video
    const displaySize = { width: video.videoWidth || 640, height: video.videoHeight || 480 };
    canvas.width = displaySize.width;
    canvas.height = displaySize.height;
    faceapi.matchDimensions(canvas, displaySize);

    // ใช้ TinyFaceDetector เพื่อความเร็วสูง (Real-time 15-30 fps)
    const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });

    async function detectFrame() {
      if (!state.cameraStarted || !state.isDetecting) return;

      if (video.readyState >= 2 && state.modelsLoaded && state.currentTab === 'scanner') {
        try {
          const detections = await faceapi.detectAllFaces(video, detectorOptions)
            .withFaceLandmarks()
            .withFaceDescriptors();

          const resizedDetections = faceapi.resizeResults(detections, displaySize);
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const now = Date.now();
          let detectedCurrentFrameNames = new Set();
          let unknownDetectedThisFrame = false;

          if (resizedDetections.length > 0) {
            resizedDetections.forEach(detection => {
              const { box } = detection.detection;
              let label = 'Unknown';
              let isKnown = false;
              let distance = 1.0;

              if (state.faceMatcher) {
                const bestMatch = state.faceMatcher.findBestMatch(detection.descriptor);
                label = bestMatch.label;
                distance = bestMatch.distance;
                isKnown = (label !== 'unknown');
              }

              // วาดกรอบและป้ายชื่อ
              drawFaceBox(ctx, box, label, isKnown, distance);

              if (isKnown) {
                detectedCurrentFrameNames.add(label);
                handlePersonGreeting(label, 1 - distance);
              } else {
                unknownDetectedThisFrame = true;
              }
            });

            // จัดการกรณีตรวจพบบุคคลแปลกหน้า (Unknown)
            if (unknownDetectedThisFrame) {
              handleUnknownGreeting();
            }
          }

          // ตรวจสอบบุคคลที่เดินออกจากรัศมีกล้อง (Garbage Collection / State Reset)
          cleanupExitedPersons(now, detectedCurrentFrameNames, unknownDetectedThisFrame);

        } catch (err) {
          console.error('Frame detection error:', err);
        }
      }

      // วนรอบถัดไป
      requestAnimationFrame(detectFrame);
    }

    requestAnimationFrame(detectFrame);
  }

  /**
   * วาดกรอบและป้ายชื่อใบหน้าบน Canvas
   */
  function drawFaceBox(ctx, box, label, isKnown, distance) {
    const color = isKnown ? '#10B981' : '#F59E0B'; // สีเขียว = รู้จัก, สีส้ม = ลูกค้าทั่วไป
    const bgColor = isKnown ? 'rgba(16, 185, 129, 0.2)' : 'rgba(245, 158, 11, 0.2)';

    // กรอบใบหน้า
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(box.x, box.y, box.width, box.height);

    // ไฮไลต์มุมกรอบแบบ Cyberpunk / Modern UI
    const cornerLength = Math.min(box.width, box.height) * 0.2;
    ctx.lineWidth = 5;
    // มุมบนซ้าย
    ctx.beginPath();
    ctx.moveTo(box.x, box.y + cornerLength);
    ctx.lineTo(box.x, box.y);
    ctx.lineTo(box.x + cornerLength, box.y);
    ctx.stroke();

    // มุมล่างขวา
    ctx.beginPath();
    ctx.moveTo(box.x + box.width, box.y + box.height - cornerLength);
    ctx.lineTo(box.x + box.width, box.y + box.height);
    ctx.lineTo(box.x + box.width - cornerLength, box.y + box.height);
    ctx.stroke();

    // แถบข้อความแสดงชื่อ
    const displayText = isKnown ? `คุณ ${label}` : 'ลูกค้าทั่วไป';
    ctx.font = 'bold 15px Sarabun, sans-serif';
    const textWidth = ctx.measureText(displayText).width;

    ctx.fillStyle = color;
    ctx.fillRect(box.x, box.y - 28, textWidth + 20, 26);

    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(displayText, box.x + 10, box.y - 9);
  }

  /**
   * จัดการการทักทายเมื่อพบใบหน้าที่ลงทะเบียนไว้ (ทักทายเพียงครั้งเดียวจนกว่าจะเดินออกจากกล้อง)
   */
  function handlePersonGreeting(name, confidence) {
    const now = Date.now();
    let person = state.trackedPersons.get(name);

    if (!person) {
      // บุคคลนี้เพิ่งปรากฏตัวหน้ากล้องเป็นครั้งแรก
      state.trackedPersons.set(name, {
        lastSeen: now,
        hasGreeted: true
      });

      // สังเคราะห์เสียงทักทาย: "สวัสดีค่ะคุณ [ชื่อ]"
      const greetingMsg = `สวัสดีค่ะคุณ ${name}`;
      speakText(greetingMsg);
      recordScanLog(name, 'KNOWN', confidence);
    } else {
      // บุคคลนี้ยังยืนอยู่หน้ากล้อง อัปเดตเวลาล่าสุด แต่ไม่พูดซ้ำ
      person.lastSeen = now;
    }
  }

  /**
   * จัดการการทักทายลูกค้าทั่วไป / ไม่พบใบหน้าในระบบ (ทักทายเพียงครั้งเดียวจนกว่าจะเดินออกจากกล้อง)
   */
  function handleUnknownGreeting() {
    const now = Date.now();
    if (!state.unknownTracker.hasGreeted) {
      state.unknownTracker.hasGreeted = true;
      state.unknownTracker.lastSeen = now;

      // สังเคราะห์เสียงทักทายลูกค้าทั่วไป: "สวัสดีค่ะคุณลูกค้า วันนี้รับอะไรดีค่ะ"
      const greetingMsg = `สวัสดีค่ะคุณลูกค้า วันนี้รับอะไรดีค่ะ`;
      speakText(greetingMsg);
      recordScanLog('ลูกค้าทั่วไป', 'UNKNOWN', 0);
    } else {
      // ลูกค้ายังยืนอยู่ อัปเดตเวลาล่าสุด
      state.unknownTracker.lastSeen = now;
    }
  }

  /**
   * ล้างสถานะเมื่อบุคคลเดินออกจากรัศมีกล้องเกินกำหนด (EXIT_THRESHOLD_MS)
   * เพื่อให้เมื่อเดินกลับเข้ามาใหม่ สามารถทักทายได้อีกครั้ง
   */
  function cleanupExitedPersons(now, detectedNames, unknownDetected) {
    // 1. ตรวจสอบบุคคลที่ลงทะเบียนไว้
    state.trackedPersons.forEach((data, name) => {
      if (!detectedNames.has(name)) {
        if (now - data.lastSeen > state.EXIT_THRESHOLD_MS) {
          // ออกจากกล้องเกิน 3 วินาที -> ลบออกเพื่อพร้อมทักทายใหม่รอบหน้า
          state.trackedPersons.delete(name);
        }
      }
    });

    // 2. ตรวจสอบลูกค้าทั่วไป (Unknown)
    if (!unknownDetected && state.unknownTracker.hasGreeted) {
      if (now - state.unknownTracker.lastSeen > state.EXIT_THRESHOLD_MS) {
        state.unknownTracker.hasGreeted = false;
        state.unknownTracker.lastSeen = 0;
      }
    }
  }

  function recordScanLog(name, status, confidence) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.logScanEvent(name, status, confidence);
    }
  }

  // --- Registration Logic ---
  async function captureFaceForRegistration() {
    if (!state.cameraStarted) {
      showToast('กรุณาเปิดกล้อง Webcam ก่อนถ่ายภาพ', 'warning');
      return;
    }

    const video = document.getElementById('webcamVideo');
    const snapshotCanvas = document.getElementById('snapshotCanvas');
    const snapshotCtx = snapshotCanvas.getContext('2d');
    const previewImg = document.getElementById('regPreviewImage');
    const captureStatus = document.getElementById('regCaptureStatus');

    snapshotCanvas.width = video.videoWidth || 640;
    snapshotCanvas.height = video.videoHeight || 480;
    snapshotCtx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);

    captureStatus.textContent = '⏳ กำลังวิเคราะห์ใบหน้าและสกัด Vector...';
    captureStatus.className = 'text-xs text-blue-400 mt-2';

    try {
      // ใช้ SsdMobilenetv1 สำหรับโหมดบันทึกใบหน้าเพื่อให้เวกเตอร์มีความแม่นยำสูงสุด
      const detection = await faceapi.detectSingleFace(snapshotCanvas)
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (!detection) {
        captureStatus.textContent = '❌ ไม่พบใบหน้าในภาพ กรุณาขยับหน้าตรงในระยะที่เหมาะสมแล้วลองใหม่';
        captureStatus.className = 'text-xs text-rose-400 mt-2';
        state.capturedDescriptor = null;
        state.capturedImageBase64 = null;
        document.getElementById('saveProfileBtn').disabled = true;
        return;
      }

      // วาดกรอบบนภาพพรีวิว
      const base64 = snapshotCanvas.toDataURL('image/jpeg', 0.85);
      previewImg.src = base64;
      previewImg.classList.remove('hidden');

      state.capturedDescriptor = Array.from(detection.descriptor);
      state.capturedImageBase64 = base64;

      captureStatus.textContent = '✅ ตรวจพบใบหน้าเรียบร้อย พร้อมสำหรับบันทึกข้อมูล';
      captureStatus.className = 'text-xs text-emerald-400 mt-2';
      document.getElementById('saveProfileBtn').disabled = false;
    } catch (err) {
      console.error('Registration detection error:', err);
      captureStatus.textContent = '❌ เกิดข้อผิดพลาดในการวิเคราะห์ใบหน้า';
      captureStatus.className = 'text-xs text-rose-400 mt-2';
    }
  }

  function saveProfile() {
    const nameInput = document.getElementById('regNameInput');
    const name = nameInput.value.trim();

    if (!name) {
      showToast('กรุณาระบุชื่อ-นามสกุล', 'warning');
      nameInput.focus();
      return;
    }

    if (!state.capturedDescriptor || !state.capturedImageBase64) {
      showToast('กรุณากดถ่ายภาพใบหน้าก่อนบันทึก', 'warning');
      return;
    }

    const saveBtn = document.getElementById('saveProfileBtn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent mr-2"></span> กำลังบันทึกข้อมูล...';

    const payload = {
      name: name,
      descriptor: state.capturedDescriptor,
      imageBase64: state.capturedImageBase64
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(response => {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '💾 บันทึกข้อมูลใบหน้า';

          if (response && response.success) {
            showToast(`ลงทะเบียนคุณ "${name}" สำเร็จเรียบร้อย`, 'success');
            // รีเซ็ตฟอร์ม
            nameInput.value = '';
            document.getElementById('regPreviewImage').classList.add('hidden');
            document.getElementById('regCaptureStatus').textContent = '';
            state.capturedDescriptor = null;
            state.capturedImageBase64 = null;
            saveBtn.disabled = true;

            // โหลดรายการใหม่และสลับไปหน้าสแกน
            loadProfilesFromBackend();
            switchTab('scanner');
          } else {
            showToast(response.message || 'บันทึกล้มเหลว', 'error');
          }
        })
        .withFailureHandler(err => {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '💾 บันทึกข้อมูลใบหน้า';
          showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
        })
        .saveFaceProfile(payload);
    } else {
      // Mock Local Dev
      setTimeout(() => {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '💾 บันทึกข้อมูลใบหน้า';
        state.profiles.push({
          id: 'MOCK_' + Date.now(),
          name: name,
          descriptors: state.capturedDescriptor,
          imageUrl: state.capturedImageBase64,
          createdAt: new Date().toLocaleString()
        });
        updateFaceMatcher();
        renderProfilesList();
        showToast(`(โหมดทดสอบ) บันทึกคุณ "${name}" สำเร็จ`, 'success');
        switchTab('scanner');
      }, 1000);
    }
  }

  function deleteProfile(id, name) {
    if (!confirm(`คุณต้องการลบข้อมูลใบหน้าของ "${name}" ใช่หรือไม่?`)) {
      return;
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      showToast(`กำลังลบข้อมูล ${name}...`, 'info');
      google.script.run
        .withSuccessHandler(response => {
          if (response && response.success) {
            showToast(`ลบข้อมูล ${name} เรียบร้อยแล้ว`, 'success');
            loadProfilesFromBackend();
          } else {
            showToast(response.message || 'ลบข้อมูลไม่สำเร็จ', 'error');
          }
        })
        .withFailureHandler(err => {
          showToast('ลบไม่สำเร็จ: ' + err.message, 'error');
        })
        .deleteFaceProfile(id);
    } else {
      state.profiles = state.profiles.filter(p => p.id !== id);
      updateFaceMatcher();
      renderProfilesList();
      showToast(`(โหมดทดสอบ) ลบ ${name} สำเร็จ`, 'success');
    }
  }

  // --- UI Rendering ---
  function renderProfilesList() {
    const container = document.getElementById('profilesListContainer');
    if (!container) return;

    if (state.profiles.length === 0) {
      container.innerHTML = `
        <div class="text-center py-12 text-slate-400">
          <svg class="w-16 h-16 mx-auto mb-3 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <p class="text-base font-medium">ยังไม่มีข้อมูลใบหน้าที่ลงทะเบียนไว้</p>
          <p class="text-xs text-slate-500 mt-1">กดที่แท็บ "ลงทะเบียนใบหน้า" เพื่อเพิ่มข้อมูลผู้ใช้ใหม่</p>
        </div>
      `;
      return;
    }

    let html = '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">';
    state.profiles.forEach(p => {
      const imgDisplay = p.imageUrl 
        ? `<img src="${p.imageUrl}" alt="${p.name}" class="w-14 h-14 rounded-full object-cover border-2 border-blue-500/50 flex-shrink-0" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=1E293B&color=38BDF8'">`
        : `<div class="w-14 h-14 rounded-full bg-slate-700 flex items-center justify-center text-lg font-bold text-blue-400 border border-slate-600 flex-shrink-0">${p.name.charAt(0)}</div>`;

      html += `
        <div class="glass-card rounded-xl p-4 flex items-center justify-between border border-slate-700/60 hover:border-blue-500/40 transition">
          <div class="flex items-center space-x-3 overflow-hidden">
            ${imgDisplay}
            <div class="truncate">
              <h4 class="font-semibold text-white truncate">${p.name}</h4>
              <p class="text-xs text-slate-400">บันทึกเมื่อ: ${p.createdAt || '-'}</p>
            </div>
          </div>
          <button onclick="deleteProfile('${p.id}', '${p.name}')" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition" title="ลบข้อมูล">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function switchTab(tabName) {
    state.currentTab = tabName;

    // Tabs Button Styles
    ['scanner', 'register', 'profiles'].forEach(t => {
      const btn = document.getElementById(`tabBtn_${t}`);
      const pane = document.getElementById(`tabPane_${t}`);
      if (t === tabName) {
        btn.className = 'px-4 py-2.5 rounded-lg text-sm font-semibold bg-blue-600 text-white shadow-lg shadow-blue-500/30 transition flex items-center space-x-2';
        pane.classList.remove('hidden');
      } else {
        btn.className = 'px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center space-x-2';
        pane.classList.add('hidden');
      }
    });

    if (tabName === 'profiles') {
      renderProfilesList();
    }
  }

  // --- Sound & Controls ---
  function toggleSound() {
    state.soundEnabled = !state.soundEnabled;
    const btn = document.getElementById('soundToggleBtn');
    if (state.soundEnabled) {
      btn.innerHTML = `
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
        </svg>
        <span class="text-sm">เปิดเสียงพูด</span>
      `;
      showToast('เปิดเสียงพูดทักทายแล้ว', 'info');
    } else {
      btn.innerHTML = `
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
        </svg>
        <span class="text-sm">ปิดเสียงพูด</span>
      `;
      window.speechSynthesis && window.speechSynthesis.cancel();
      showToast('ปิดเสียงพูดทักทายแล้ว', 'info');
    }
  }

  function testGreetingSpeech(type) {
    if (type === 'known') {
      speakText('สวัสดีค่ะคุณ ธนกร');
    } else {
      speakText('สวัสดีค่ะคุณลูกค้า วันนี้รับอะไรดีค่ะ');
    }
  }

  // --- Toast Notifications ---
  function showToast(message, type = 'info') {
    const toast = document.getElementById('toastNotification');
    const toastText = document.getElementById('toastText');
    const toastIcon = document.getElementById('toastIcon');

    if (!toast) return;

    let iconSvg = '';
    let borderClass = 'border-blue-500/50';

    if (type === 'success') {
      iconSvg = '<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
      borderClass = 'border-emerald-500/50 text-emerald-300';
    } else if (type === 'warning') {
      iconSvg = '<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>';
      borderClass = 'border-amber-500/50 text-amber-300';
    } else if (type === 'error') {
      iconSvg = '<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
      borderClass = 'border-rose-500/50 text-rose-300';
    } else {
      iconSvg = '<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
      borderClass = 'border-blue-500/50 text-blue-300';
    }

    toastIcon.innerHTML = iconSvg;
    toastText.textContent = message;
    toast.className = `fixed bottom-5 right-5 z-50 glass-card px-4 py-3 rounded-xl flex items-center space-x-3 shadow-2xl border ${borderClass} toast-visible transition-all duration-300`;

    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => {
      toast.className = 'fixed bottom-5 right-5 z-50 hidden toast-enter';
    }, 4000);
  }

  // --- Event Listeners Setup ---
  function setupEventListeners() {
    const bind = (id, event, handler) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener(event, handler);
    };

    bind('startCameraBtn', 'click', startCamera);
    bind('stopCameraBtn', 'click', stopCamera);
    bind('soundToggleBtn', 'click', toggleSound);
    bind('captureForRegBtn', 'click', captureFaceForRegistration);
    bind('saveProfileBtn', 'click', saveProfile);
    bind('refreshProfilesBtn', 'click', loadProfilesFromBackend);

    // Audio test buttons
    bind('testKnownVoiceBtn', 'click', () => testGreetingSpeech('known'));
    bind('testUnknownVoiceBtn', 'click', () => testGreetingSpeech('unknown'));
  }
</script>
